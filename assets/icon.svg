<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base (Clean squircle for Android Maskable Icon) -->
  <rect width="512" height="512" rx="115" fill="#ffffff" />

  <!-- Logo Resmi SD NEGERI 14 TOBOALI -->
  <g transform="translate(46, 46) scale(4.2)" filter="url(#logoShadow)">
    <!-- Lingkaran Luar Biru dengan Lis Emas/Kuning -->
    <circle cx="50" cy="50" r="47" fill="#2563eb" stroke="#f59e0b" stroke-width="5" />
    
    <!-- Perisai Dalam -->
    <path d="M50 16 L78 34 L78 66 L50 84 L22 66 L22 34 Z" fill="#1e40af" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Lidah Api Obor Emas -->
    <path d="M50 24 L64 38 L36 38 Z" fill="#fbbf24" />
    
    <!-- Tangkai Obor -->
    <rect x="47" y="38" width="6" height="26" fill="#f59e0b" rx="2" />
    
    <!-- Sayap / Buku Terbuka Putih -->
    <path d="M32 52 Q50 72 68 52 Q50 80 32 52 Z" fill="#ffffff" />
    
    <!-- Inti Titik Merah Pendidikan -->
    <circle cx="50" cy="51" r="8" fill="#ef4444" />
    
    <!-- Tulisan Resmi SDN 14 TOBOALI -->
    <text x="50" y="93.5" font-size="8.5" font-family="'Arial Black', Arial, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SDN 14 TOBOALI</text>
  </g>
</svg>
