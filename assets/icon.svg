<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base (Clean White with Android Maskable Safe-Zone 80%) -->
  <rect width="512" height="512" rx="115" fill="#ffffff" />

  <!-- Logo Resmi SD NEGERI 14 TOBOALI (Preserved within 80% Safe Zone, x=51, y=51, w=410, h=410) -->
  <g filter="url(#logoShadow)">
    <image href="icon-192.png" x="51" y="51" width="410" height="410" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
